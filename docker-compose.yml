services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "3002:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/dist:ro        
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./storage:/app/storage
    environment:
      - PORT=3000
      - STORAGE_DIR=/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no"                         
    volumes:
      - frontend_dist:/app/dist           

volumes:
  caddy_data:
  caddy_config:
  frontend_dist:                          