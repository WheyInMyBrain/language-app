services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - frontend_dist:/app/dist

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "3002:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/dist:ro
      - ~/ssl:/etc/ssl:ro    
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env

volumes:
  caddy_data:
  caddy_config:
  frontend_dist: